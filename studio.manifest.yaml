# Which paths belong to the studio and which belong to the person.
# An update replaces every studio-owned path and never touches a person-owned one.

version: 0.92.1

# The AI detector (Pangram, scripts/check-human.py --detector). `parked`: no call is made anywhere and every
# reading says "parked". Set to `on` to call it again at the two points CLAUDE.md names.
detector: parked

# The studio's master dashboard app in Base44; setup-dashboard copies it for each person.
dashboard_master: 6ada41a371d747486635d80a
# The Notion master template (fallback and mirror); the person duplicates it and setup-notion connects the copy.
notion_master: 401aa945211781c2a8edf13ab6ce33df
# The link a person opens to duplicate it (published to the web, duplicate as template on).
notion_template_link: https://mesquite-ferret-8c4.notion.site/Content-Studio-master-template-401aa945211781c2a8edf13ab6ce33df
# The Figma template library master; setup-figma connects a person's duplicate of it.
figma_master: 6uKX7eKR9WLrfsbAKsM7ZL
# The link a person opens to duplicate it (shared as "Anyone with the link can view").
figma_template_link: https://www.figma.com/design/6uKX7eKR9WLrfsbAKsM7ZL

