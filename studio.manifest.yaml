client_owned:
  # The person's README: --init writes it once from docs/getting-started.md; an update never replaces it.
  - README.md
  - canon/
  # The working banks: ideas, questions, the evidence ledger and rewrites/. The canon holds confirmed entries only.
  - bank/
  - material/
  - pieces/
  - inbox/
  - journal/
  - config/
  - proposals.md
  - YOUR-STUDIO.md
  - tests/client/
  # Run notes are written by the instance's own runs, so they belong to the person; an update adds the file once and never replaces it.
  - studio-notes.md
  # The session log: the stop hook writes which files changed; /end writes what was decided.
  - sessions/
  # The person's saved routines (skills/job-recipes). Each recipe's shortcut sits in .claude/skills/<name>/,
  # which survives an update because the studio's own commands are listed above one by one.
  - recipes/
  # The person's visual workspace, made by /visual-system: their brief, directions, system and package.
  - visual/
  # Copies of studio files the person changed, kept by an update before it replaced them.
  - studio-local-backup/
  # Checksums of the studio files as last installed; the update writes it and reads it to spot local changes.
  - .studio-installed
